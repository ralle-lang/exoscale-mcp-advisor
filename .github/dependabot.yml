# Dependabot keeps the SHA-pinned actions current.
#
# Every action in .github/workflows is pinned to a full commit SHA (hardened in
# #13/PR #14) — immutable by design, which also means a pin never picks up an
# upstream security fix on its own. Dependabot is what closes that loop: it
# raises the SHA and rewrites the trailing `# vX.Y.Z` comment, so the pins stay
# both immutable and current.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      # The exoscale-connector floor is a deliberate policy decision, not a
      # dependency bump: it is raised only after the release is triaged through
      # .claude/skills/connector-release-triage (docs-only bump / new live tool /
      # decline), and .github/workflows/connector-watch.yml files that triage
      # issue. Letting Dependabot raise it would bypass that judgement and the
      # CI floor matrix that guards it (design §16).
      - dependency-name: exoscale-connector

      # `mcp` is capped at <2 on purpose (see the comment on the dependency in
      # pyproject.toml). mcp 2.x is not a bump but a migration: it moves FastMCP
      # out of `mcp.server.fastmcp` and renames the ToolAnnotations fields to
      # snake_case — and those annotations are the read-only contract, asserted
      # per-tool by tests/unit/test_no_mutation.py. Dependabot proposed exactly
      # that widening in #25; CI failed with 9 errors and it was closed. Only
      # major updates are ignored, so a future in-range floor raise can still be
      # proposed; adopting 2.x stays a deliberate, tested migration.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
