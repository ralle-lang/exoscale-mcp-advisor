[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exoscale-mcp-advisor"
# Version is single-sourced from the package __version__ (see [tool.hatch.version]).
dynamic = ["version"]
description = "Read-only Exoscale advisor MCP server — docs search plus list-only live catalogue queries, structurally incapable of mutation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raphael Lang" }]
keywords = ["exoscale", "mcp", "advisor", "cloud", "ai", "read-only"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
# Runtime dependencies — see docs/mcp-advisor-design.md §8.
# - `mcp`: the official Model Context Protocol Python SDK (stdio server, FastMCP).
# - `exoscale-connector>=0.6.0`: 0.3.0 first shipped the packaged
#   `_skill/reference.md` knowledge bundle this server reads (design §4) and the
#   read-only `list` catalogue clients it wraps (design §3); 0.4.0 added
#   `SksClusterClient.list_versions` backing the `list_sks_versions` tool (§15);
#   0.5.0 hardened the HTTP layer with connection-level retry resilience, which
#   the live `list` tools run on; 0.6.0 enriched the packaged bundle with new
#   asset-type reference pages (vpc, kms, deploy-target, event) that the docs
#   tools surface for free (design §17) — so the floor moves to 0.6.0 to
#   guarantee that knowledge to every consumer.
# mcp is capped below 2.0: the server uses FastMCP / ToolAnnotations and the
# structural test introspects the tool manager, so a major SDK bump could break
# the build and must be vetted deliberately rather than picked up silently.
dependencies = [
    "mcp>=1.2,<3",
    "exoscale-connector>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/ralle-lang/exoscale-mcp-advisor"
Repository = "https://github.com/ralle-lang/exoscale-mcp-advisor"
Issues = "https://github.com/ralle-lang/exoscale-mcp-advisor/issues"
Changelog = "https://github.com/ralle-lang/exoscale-mcp-advisor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff==0.16.5",  # pinned: see [tool.ruff]; bumped via Dependabot
    "mypy==2.3.1",  # pinned for the same reason as ruff; bumped via Dependabot
    "coverage>=7.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
# `uvx exoscale-mcp-advisor` (or a plain console invocation) starts the stdio
# server — design §8. No clone/install step for consumers.
exoscale-mcp-advisor = "exoscale_mcp_advisor.server:main"

[tool.hatch.version]
path = "src/exoscale_mcp_advisor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/exoscale_mcp_advisor"]

[tool.ruff]
# Ruff is pinned in [dev] and its rule set is declared here on purpose. With
# neither in place the lint gate meant "whatever the newest ruff enforces this
# week": CI installs the latest, and 0.16 turned on pyupgrade rules 0.15 did
# not, so the Lint step failed on a branch that touched no Python. Rules are now
# a repo decision, and a ruff upgrade arrives as a reviewable Dependabot PR
# rather than a surprise red build.
#
# target-version is inferred from requires-python (>=3.10) — not duplicated here
# so the two cannot drift.

[tool.ruff.lint]
# E4/E7/E9 + F are ruff's historical defaults. The rest is what this codebase
# already satisfies with no edits, so it costs nothing to enforce:
#   UP  pyupgrade      — the modern syntax the >=3.10 floor allows
#   I   isort          — import order, already tidy
#   B   bugbear        — the usual correctness traps
#   SIM flake8-simplify
#   RUF ruff's own
# E5 (line length) is deliberately absent: nine lines run 89–97 chars and no
# formatter is enforced here, so E501 would be pure churn. Revisit together with
# adopting `ruff format`.
select = ["E4", "E7", "E9", "F", "UP", "I", "B", "SIM", "RUF"]

[tool.coverage.report]
# The module-execution guard is a launcher line, not behaviour to test.
exclude_also = ["if __name__ == .__main__.:"]
